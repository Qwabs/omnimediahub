<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
    <style>
      html,
      body {
        margin: 0;
      }
      iframe {
        width: 1400px;
        height: 1000px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="f" src="/"></iframe>
    <script>
      /* Phase 4 probe: the video catalog (ffmpeg). */
      async function main() {
        const f = document.getElementById('f')
        const results = {}
        const wait = (ms) => new Promise((r) => setTimeout(r, ms))
        const probe = { step: 'boot', results }
        window.__probe = probe
        const mark = (value) => {
          probe.step = value
        }

        async function until(fn, timeout = 180000, stepMs = 100) {
          const t0 = performance.now()
          for (;;) {
            try {
              const value = await fn()
              if (value) return value
            } catch {
              /* keep polling */
            }
            if (performance.now() - t0 > timeout) throw new Error('timeout: ' + probe.step)
            await wait(stepMs)
          }
        }

        const navigate = (url) =>
          new Promise((resolve) => {
            f.onload = () => resolve()
            f.src = url
          })
        const storeOf = () => f.contentWindow.__omh.useSession.getState()
        const openTab = (name) => {
          const tab = [...f.contentDocument.querySelectorAll('[role="tab"]')].find((t) =>
            t.textContent.trim().startsWith(name),
          )
          tab?.click()
        }
        const setText = async (id, value) => {
          const win = f.contentWindow
          const el = await until(() => f.contentDocument.getElementById(id))
          const setter = Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype, 'value').set
          setter.call(el, value)
          el.dispatchEvent(new win.Event('input', { bubbles: true }))
        }
        const setRange = async (id, value) => {
          const el = await until(() => f.contentDocument.getElementById(id))
          const win = f.contentWindow
          const setter = Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype, 'value').set
          setter.call(el, String(value))
          el.dispatchEvent(new win.Event('input', { bubbles: true }))
          el.dispatchEvent(new win.Event('change', { bubbles: true }))
        }
        const setSelect = async (id, value) => {
          const el = await until(() => f.contentDocument.getElementById(id))
          const win = f.contentWindow
          const setter = Object.getOwnPropertyDescriptor(win.HTMLSelectElement.prototype, 'value').set
          setter.call(el, value)
          el.dispatchEvent(new win.Event('change', { bubbles: true }))
        }
        const setPair = async (id, start, end) => {
          await setRange(`${id}-start`, start)
          await setRange(`${id}-end`, end)
        }
        const setAsset = async (file) => {
          const win = f.contentWindow
          const input = await until(() => f.contentDocument.querySelector('[data-testid="asset-input"]'))
          const dt = new win.DataTransfer()
          dt.items.add(file)
          input.files = dt.files
          input.dispatchEvent(new win.Event('change', { bubbles: true }))
        }

        const drop = async (files, waitForButton = true) => {
          const win = f.contentWindow
          const doc = f.contentDocument
          openTab('files')
          await until(() => doc.querySelector('[data-testid="dropzone"]'), 20000)
          const dt = new win.DataTransfer()
          for (const file of files) dt.items.add(file)
          doc
            .querySelector('[data-testid="dropzone"]')
            .dispatchEvent(new win.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }))
          if (!waitForButton) return
          await until(() => {
            const button = doc.querySelector('[data-testid="process"]')
            return button && !button.disabled
          }, 30000)
        }

        const process = async () => {
          const startLogId = storeOf().logs.at(-1)?.id ?? 0
          f.contentDocument.querySelector('[data-testid="process"]').click()
          await until(
            () =>
              storeOf().logs.some(
                (line) => line.id > startLogId && /done in|cancelled after|none of the|needs a/i.test(line.text),
              ),
            300000,
          )
          await until(() => storeOf().running === false, 60000)
          await wait(150)
          const state = storeOf()
          probe.lastLogs = state.logs.slice(-10).map((l) => l.text)
          return [
            ...state.files.filter((x) => x.result).map((x) => ({ from: x.name, ...x.result })),
            ...state.combinedResults.map((r) => ({ from: '(combined)', ...r })),
          ]
        }

        const runTool = async (path, files, configure) => {
          mark(`navigate ${path}`)
          await navigate(path)
          if (files && files.length > 0) {
            mark(`drop ${path}`)
            await drop(files)
          }
          if (configure) {
            mark(`configure ${path}`)
            openTab('settings')
            await configure()
          }
          mark(`process ${path}`)
          return process()
        }

        /* ---------------- helpers ---------------- */

        const magicOf = async (blob) => {
          const bytes = new Uint8Array(await blob.slice(0, 12).arrayBuffer())
          return [...bytes].map((b) => b.toString(16).padStart(2, '0')).join(' ')
        }

        const pixelInfo = async (blob) => {
          const bitmap = await createImageBitmap(blob)
          const dimensions = `${bitmap.width}x${bitmap.height}`
          bitmap.close()
          return dimensions
        }

        const toFileFromBlob = (blob, name) => new File([blob], name, { type: blob.type })

        async function makeWebm(seconds = 1.4, width = 160, height = 120, withAudio = false) {
          const canvas = document.createElement('canvas')
          canvas.width = width
          canvas.height = height
          const ctx = canvas.getContext('2d')
          const stream = canvas.captureStream(15)
          let audioContext = null
          let oscillator = null
          if (withAudio) {
            audioContext = new AudioContext()
            const destination = audioContext.createMediaStreamDestination()
            oscillator = audioContext.createOscillator()
            oscillator.frequency.value = 440
            oscillator.connect(destination)
            oscillator.start()
            for (const track of destination.stream.getAudioTracks()) stream.addTrack(track)
          }
          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' })
          const chunks = []
          recorder.ondataavailable = (event) => chunks.push(event.data)
          const stopped = new Promise((resolve) => (recorder.onstop = resolve))
          recorder.start()
          const t0 = performance.now()
          await new Promise((resolve) => {
            const tick = () => {
              const t = performance.now() - t0
              ctx.fillStyle = `hsl(${(t / 4) % 360} 80% 60%)`
              ctx.fillRect(0, 0, width, height)
              if (t < seconds * 1000) requestAnimationFrame(tick)
              else resolve()
            }
            tick()
          })
          recorder.stop()
          await stopped
          oscillator?.stop()
          await audioContext?.close()
          return new File(chunks, `clip-${width}x${height}${withAudio ? '-audio' : ''}.webm`, { type: 'video/webm' })
        }

        /** Video dimensions, read back by extracting a frame with our own tool. */
        const videoDimensions = async (blob, name) => {
          const frames = await runTool('/tools/video/video-thumbnails', [toFileFromBlob(blob, name)], async () => {
            await setRange('time', 0.2)
          })
          return pixelInfo(frames[0].blob)
        }

        try {
          const clip = await makeWebm()
          const clipAudio = await makeWebm(1.4, 160, 120, true)
          const asVideo = (name, blob = clip) => toFileFromBlob(blob, name)

          /* 1. convert to MP4 */
          {
            const out = await runTool('/tools/video/video-converter', [asVideo('clip.webm')], async () => {
              await setSelect('format', 'mp4')
              await setSelect('resolution', '720')
            })
            results.convert = {
              name: out[0].name,
              type: out[0].type,
              sizeKB: Math.round(out[0].size / 1024),
              magic: await magicOf(out[0].blob),
            }
          }

          /* 2. lossless trim */
          {
            const out = await runTool('/tools/video/video-trimmer', [asVideo('clip.webm')], async () => {
              await setPair('range', 0, 0.6)
            })
            results.trim = {
              name: out[0].name,
              sizeKB: Math.round(out[0].size / 1024),
              magic: await magicOf(out[0].blob),
            }
          }

          /* 3. compress to a target size */
          {
            const out = await runTool('/tools/video/video-compressor', [asVideo('clip.webm')], async () => {
              await setSelect('mode', 'target-size')
              await setRange('targetMb', 1)
            })
            results.compress = {
              sizeKB: Math.round(out[0].size / 1024),
              underTarget: out[0].size <= 1024 * 1024,
              logs: probe.lastLogs.filter((l) => l.includes('target')),
            }
          }

          /* 4. crop to 1:1, verified via frame extraction */
          {
            const out = await runTool('/tools/video/video-cropper', [asVideo('clip.webm')], async () => {
              await setSelect('ratio', '1:1')
            })
            results.crop = { dimensions: await videoDimensions(out[0].blob, out[0].name), expected: '120x120' }
          }

          /* 5. resize (contain) verified via frame extraction */
          {
            const out = await runTool('/tools/video/video-resizer', [asVideo('clip.webm')], async () => {
              await setRange('size-width', 240)
              await setRange('size-height', 240)
              await setSelect('fit', 'contain')
            })
            results.resize = { dimensions: await videoDimensions(out[0].blob, out[0].name), expected: '240x240' }
          }

          /* 6. rotate 90° */
          {
            const out = await runTool('/tools/video/video-rotator', [asVideo('clip.webm')], async () => {
              await setSelect('transform', '90')
            })
            results.rotate = { dimensions: await videoDimensions(out[0].blob, out[0].name), expected: '120x160' }
          }

          /* 7. speed 2x (with audio: exercises the atempo chain) */
          {
            const out = await runTool('/tools/video/video-speed', [asVideo('clip-audio.webm', clipAudio)], async () => {
              await setRange('speed', 2)
            })
            const result = out[0]
            results.speed = result
              ? { sizeKB: Math.round(result.size / 1024), logs: probe.lastLogs.filter((l) => /speed|audio|no audio/.test(l)) }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 7b. speed on a silent clip: the video-only fallback */
          {
            const out = await runTool('/tools/video/video-speed', [asVideo('clip.webm')], async () => {
              await setRange('speed', 2)
            })
            results.speedSilent = out[0]
              ? { sizeKB: Math.round(out[0].size / 1024), logs: probe.lastLogs.filter((l) => /no audio/.test(l)) }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 8. volume gain (with audio) */
          {
            const out = await runTool('/tools/video/video-volume', [asVideo('clip-audio.webm', clipAudio)], async () => {
              await setRange('gain', 6)
            })
            const result = out[0]
            results.volume = result
              ? { sizeKB: Math.round(result.size / 1024), logs: probe.lastLogs.filter((l) => /audio|no audio/.test(l)) }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 9. watermark (text, rendered on-device) */
          {
            const out = await runTool('/tools/video/video-watermark', [asVideo('clip.webm')], async () => {
              await setText('text', 'OMH')
              await setRange('fontSize', 24)
            })
            const result = out[0]
            results.watermark = result
              ? { sizeKB: Math.round(result.size / 1024), logs: probe.lastLogs.filter((l) => l.includes('watermark')) }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 10. burn subtitles from an SRT asset */
          {
            const srt = [
              '1',
              '00:00:00,100 --> 00:00:00,700',
              'First cue',
              '',
              '2',
              '00:00:00,800 --> 00:00:01,300',
              'Second cue',
              '',
            ].join('\n')
            const out = await runTool(
              '/tools/video/video-subtitles',
              [],
              async () => {
                openTab('files')
                await until(() => f.contentDocument.querySelector('[data-testid="dropzone"]'), 20000)
                const win = f.contentWindow
                const dt = new win.DataTransfer()
                dt.items.add(asVideo('clip.webm'))
                f.contentDocument
                  .querySelector('[data-testid="dropzone"]')
                  .dispatchEvent(new win.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }))
                await wait(500)
                await setAsset(new File([srt], 'cues.srt', { type: 'text/plain' }))
                openTab('settings')
                await setRange('fontSize', 20)
              },
            )
            results.subtitles = out[0]
              ? { sizeKB: Math.round(out[0].size / 1024), logs: probe.lastLogs.filter((l) => l.includes('cues')) }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 11. merge two clips */
          {
            const second = await makeWebm(0.8, 160, 120)
            const out = await runTool('/tools/video/video-merger', [
              asVideo('clip-a.webm'),
              toFileFromBlob(second, 'clip-b.webm'),
            ])
            results.merge = out[0]
              ? {
                  sizeKB: Math.round(out[0].size / 1024),
                  dimensions: await videoDimensions(out[0].blob, out[0].name),
                  logs: probe.lastLogs.filter((l) => /clips|no audio/.test(l)),
                }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 12. thumbnails: single / interval / contact sheet */
          {
            const single = await runTool('/tools/video/video-thumbnails', [asVideo('clip.webm')], async () => {
              await setRange('time', 0.3)
            })
            results.thumbSingle = { name: single[0].name, dimensions: await pixelInfo(single[0].blob) }

            const many = await runTool('/tools/video/video-thumbnails', [asVideo('clip.webm')], async () => {
              await setSelect('mode', 'interval')
              await setRange('interval', 1)
            })
            results.thumbInterval = {
              name: many[0].name,
              type: many[0].type,
              magic: await magicOf(many[0].blob),
              logs: probe.lastLogs.filter((l) => l.includes('frames packaged')),
            }

            const sheet = await runTool('/tools/video/video-thumbnails', [asVideo('clip.webm')], async () => {
              await setSelect('mode', 'contact-sheet')
              await setRange('interval', 1)
              await setRange('columns', 2)
              await setRange('rows', 2)
            })
            results.thumbSheet = { dimensions: await pixelInfo(sheet[0].blob) }
          }

          /* 13. extract audio (from a clip that has audio) */
          {
            const out = await runTool('/tools/video/video-to-audio', [asVideo('clip-audio.webm', clipAudio)], async () => {
              await setSelect('format', 'mp3')
            })
            results.toAudio = out[0]
              ? {
                  name: out[0].name,
                  type: out[0].type,
                  sizeKB: Math.round(out[0].size / 1024),
                  magic: await magicOf(out[0].blob),
                }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }

          /* 13b. extract audio from a silent clip: expect a clear message */
          {
            const out = await runTool('/tools/video/video-to-audio', [asVideo('clip.webm')], async () => {
              await setSelect('format', 'mp3')
            })
            results.toAudioSilent = out[0]
              ? { unexpected: true }
              : { errorMessage: probe.lastLogs.filter((l) => /no audio track/.test(l)) }
          }

          /* 14. video → animated WebP */
          {
            const out = await runTool('/tools/video/video-to-webp', [asVideo('clip.webm')], async () => {
              await setPair('range', 0, 1)
              await setRange('width', 240)
            })
            results.toWebp = out[0]
              ? {
                  name: out[0].name,
                  type: out[0].type,
                  sizeKB: Math.round(out[0].size / 1024),
                  magic: await magicOf(out[0].blob),
                }
              : { failed: true, logs: probe.lastLogs.slice(-3) }
          }
        } catch (error) {
          results.fatal = String(error && error.stack ? error.stack : error)
          try {
            results.logs = storeOf().logs.slice(-10).map((l) => `${l.level}: ${l.text}`)
          } catch {
            /* ignore */
          }
        }

        probe.step = 'done'
        document.title = JSON.stringify(results)
      }

      main().catch((error) => {
        document.title = JSON.stringify({ fatal: String(error) })
      })
    </script>
  </body>
</html>
