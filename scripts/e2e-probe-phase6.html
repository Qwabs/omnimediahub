<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
    <style>
      html,
      body {
        margin: 0;
      }
      iframe {
        width: 1400px;
        height: 1000px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="f" src="/"></iframe>
    <script>
      /* Phase 6 probe: local AI (segmentation, super-resolution, inpaint, detection, whisper). */
      async function main() {
        const f = document.getElementById('f')
        const results = {}
        const wait = (ms) => new Promise((r) => setTimeout(r, ms))
        const probe = { step: 'boot', results }
        window.__probe = probe
        const mark = (value) => {
          probe.step = value
        }

        async function until(fn, timeout = 180000, stepMs = 100) {
          const t0 = performance.now()
          for (;;) {
            try {
              const value = await fn()
              if (value) return value
            } catch {
              /* keep polling */
            }
            if (performance.now() - t0 > timeout) throw new Error('timeout: ' + probe.step)
            await wait(stepMs)
          }
        }

        const navigate = (url) =>
          new Promise((resolve) => {
            f.onload = () => resolve()
            f.src = url
          })
        const storeOf = () => f.contentWindow.__omh.useSession.getState()
        const openTab = (name) => {
          const tab = [...f.contentDocument.querySelectorAll('[role="tab"]')].find((t) =>
            t.textContent.trim().startsWith(name),
          )
          tab?.click()
        }
        const setRange = async (id, value) => {
          const el = await until(() => f.contentDocument.getElementById(id), 20000)
          const win = f.contentWindow
          const setter = Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype, 'value').set
          setter.call(el, String(value))
          el.dispatchEvent(new win.Event('input', { bubbles: true }))
          el.dispatchEvent(new win.Event('change', { bubbles: true }))
        }
        const setSelect = async (id, value) => {
          const el = await until(() => f.contentDocument.getElementById(id), 20000)
          const win = f.contentWindow
          const setter = Object.getOwnPropertyDescriptor(win.HTMLSelectElement.prototype, 'value').set
          setter.call(el, value)
          el.dispatchEvent(new win.Event('change', { bubbles: true }))
        }

        const drop = async (files, waitForButton = true) => {
          const win = f.contentWindow
          const doc = f.contentDocument
          openTab('files')
          await until(() => doc.querySelector('[data-testid="dropzone"]'), 20000)
          const dt = new win.DataTransfer()
          for (const file of files) dt.items.add(file)
          doc
            .querySelector('[data-testid="dropzone"]')
            .dispatchEvent(new win.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }))
          if (!waitForButton) return
          await until(() => {
            const button = doc.querySelector('[data-testid="process"]')
            return button && !button.disabled
          }, 30000)
        }

        const process = async (timeoutMs = 600000) => {
          const startLogId = storeOf().logs.at(-1)?.id ?? 0
          f.contentDocument.querySelector('[data-testid="process"]').click()
          await until(
            () =>
              storeOf().logs.some(
                (line) => line.id > startLogId && /done in|cancelled after|none of the|needs a/i.test(line.text),
              ),
            timeoutMs,
          )
          await until(() => storeOf().running === false, 120000)
          await wait(200)
          const state = storeOf()
          probe.lastLogs = state.logs.slice(-14).map((l) => l.text)
          return [
            ...state.files.filter((x) => x.result).map((x) => ({ from: x.name, ...x.result })),
            ...state.combinedResults.map((r) => ({ from: '(combined)', ...r })),
          ]
        }

        const runTool = async (path, files, configure, timeoutMs) => {
          mark(`navigate ${path}`)
          await navigate(path)
          if (files && files.length > 0) {
            mark(`drop ${path}`)
            await drop(files)
          }
          if (configure) {
            mark(`configure ${path}`)
            openTab('settings')
            await configure()
          }
          mark(`process ${path}`)
          return process(timeoutMs)
        }

        /* ---------------- fixtures + analysis ---------------- */

        const subjectCanvas = (width = 384, height = 384) => {
          const canvas = document.createElement('canvas')
          canvas.width = width
          canvas.height = height
          const ctx = canvas.getContext('2d')
          // Background: flat teal.
          ctx.fillStyle = '#2f7f8f'
          ctx.fillRect(0, 0, width, height)
          // Subject: a simple head-and-shoulders silhouette in a warm tone.
          ctx.fillStyle = '#e8b98a'
          ctx.beginPath()
          ctx.arc(width / 2, height * 0.36, width * 0.16, 0, Math.PI * 2)
          ctx.fill()
          ctx.beginPath()
          ctx.ellipse(width / 2, height * 0.95, width * 0.34, height * 0.42, 0, 0, Math.PI * 2)
          ctx.fill()
          return canvas
        }

        const flatCanvas = (width = 320, height = 240) => {
          const canvas = document.createElement('canvas')
          canvas.width = width
          canvas.height = height
          const ctx = canvas.getContext('2d')
          const grad = ctx.createLinearGradient(0, 0, width, height)
          grad.addColorStop(0, '#0b3d91')
          grad.addColorStop(1, '#30d158')
          ctx.fillStyle = grad
          ctx.fillRect(0, 0, width, height)
          ctx.fillStyle = '#fdfcfc'
          ctx.font = '28px monospace'
          ctx.fillText('OMH', 20, 60)
          return canvas
        }

        const toFile = async (canvas, type, name, quality = 0.95) => {
          const blob = await new Promise((r) => canvas.toBlob(r, type, quality))
          return new File([blob], name, { type })
        }
        const toFileFromBlob = (blob, name) => new File([blob], name, { type: blob.type })

        const imageStats = async (blob) => {
          const bitmap = await createImageBitmap(blob)
          const canvas = document.createElement('canvas')
          canvas.width = bitmap.width
          canvas.height = bitmap.height
          const ctx = canvas.getContext('2d', { willReadFrequently: true })
          ctx.drawImage(bitmap, 0, 0)
          const data = ctx.getImageData(0, 0, bitmap.width, bitmap.height).data
          let transparent = 0
          let opaque = 0
          let minAlpha = 255
          for (let i = 3; i < data.length; i += 4) {
            const alpha = data[i]
            if (alpha < 16) transparent += 1
            if (alpha > 240) opaque += 1
            if (alpha < minAlpha) minAlpha = alpha
          }
          const total = (data.length / 4) | 0
          const corner = Array.from(ctx.getImageData(2, 2, 1, 1).data)
          const center = Array.from(ctx.getImageData(Math.floor(bitmap.width / 2), Math.floor(bitmap.height / 2), 1, 1).data)
          const dimensions = `${bitmap.width}x${bitmap.height}`
          bitmap.close()
          return {
            dimensions,
            transparentPct: Math.round((transparent / total) * 100),
            opaquePct: Math.round((opaque / total) * 100),
            minAlpha,
            corner,
            center,
          }
        }

        const pixelAt = async (blob, x, y) => {
          const bitmap = await createImageBitmap(blob)
          const canvas = document.createElement('canvas')
          canvas.width = bitmap.width
          canvas.height = bitmap.height
          const ctx = canvas.getContext('2d', { willReadFrequently: true })
          ctx.drawImage(bitmap, 0, 0)
          const data = Array.from(ctx.getImageData(x, y, 1, 1).data)
          bitmap.close()
          return data
        }

        try {
          /* 1. background removal */
          {
            const subject = await toFile(subjectCanvas(), 'image/png', 'subject.png')
            const out = await runTool('/tools/ai/remove-background', [subject], undefined, 600000)
            results.removeBackground = out[0]
              ? {
                  name: out[0].name,
                  type: out[0].type,
                  stats: await imageStats(out[0].blob),
                  logs: probe.lastLogs.filter((l) => /ran on|transparent|background/.test(l)),
                }
              : { failed: true, logs: probe.lastLogs.slice(-4) }
          }

          /* 2. 2x AI upscale */
          {
            const source = await toFile(flatCanvas(160, 120), 'image/png', 'small.png')
            const out = await runTool('/tools/ai/image-upscaler', [source], async () => {
              await setSelect('factor', '2')
            }, 600000)
            results.upscale = out[0]
              ? {
                  name: out[0].name,
                  dimensions: (await imageStats(out[0].blob)).dimensions,
                  expected: '320x240',
                  logs: probe.lastLogs.filter((l) => /ran on|output/.test(l)),
                }
              : { failed: true, logs: probe.lastLogs.slice(-4) }
          }

          /* 3. unpixelate keeps the original size */
          {
            const source = await toFile(flatCanvas(160, 120), 'image/png', 'blocky.png')
            const out = await runTool('/tools/ai/unpixelate-image', [source], async () => {
              await setRange('strength', 40)
            }, 600000)
            results.unpixelate = out[0]
              ? {
                  dimensions: (await imageStats(out[0].blob)).dimensions,
                  expected: '160x120',
                  logs: probe.lastLogs.filter((l) => /restored|ran on/.test(l)),
                }
              : { failed: true, logs: probe.lastLogs.slice(-4) }
          }

          /* 4. inpaint: paint a mask through the real UI, then process */
          {
            const source = await toFile(flatCanvas(320, 240), 'image/png', 'painted.png')
            mark('navigate inpaint')
            await navigate('/tools/ai/remove-object')
            mark('drop inpaint')
            await drop([source], false)
            const canvas = await until(
              () => f.contentDocument.querySelector('[data-testid="mask-canvas"]'),
              20000,
            )
            mark('paint mask')
            const rect = canvas.getBoundingClientRect()
            const pick = (fx, fy) => ({ x: rect.left + rect.width * fx, y: rect.top + rect.height * fy })
            // Paint over the white "OMH" text so the change is unambiguous.
            const start = pick(0.06, 0.16)
            const end = pick(0.3, 0.3)
            const pointer = (type, point) =>
              canvas.dispatchEvent(
                new f.contentWindow.PointerEvent(type, {
                  bubbles: true,
                  cancelable: true,
                  clientX: point.x,
                  clientY: point.y,
                  pointerId: 1,
                  isPrimary: true,
                  buttons: 1,
                }),
              )
            pointer('pointerdown', start)
            for (let i = 1; i <= 6; i += 1) {
              pointer('pointermove', {
                x: start.x + ((end.x - start.x) * i) / 6,
                y: start.y + ((end.y - start.y) * i) / 6,
              })
              await wait(20)
            }
            pointer('pointerup', end)
            await wait(400)
            const maskStatus = f.contentDocument.querySelector('[data-testid="mask-status"]')?.textContent ?? ''
            const maskReady = Boolean(storeOf().assets.mask)
            const beforePaint = await pixelAt(source, 40, 55)
            mark('process inpaint')
            const out = await process(600000)
            results.inpaint = {
              maskStatus: maskStatus.trim(),
              maskReady,
              dimensions: out[0] ? (await imageStats(out[0].blob)).dimensions : null,
              beforePaint,
              afterPaint: out[0] ? await pixelAt(out[0].blob, 40, 55) : null,
              untouched: out[0] ? await pixelAt(out[0].blob, 280, 220) : null,
              logs: probe.lastLogs.filter((l) => /classical fill|painted|repaired/.test(l)),
            }
          }

          /* 5. person detection (honest path: synthetic image has no people) */
          {
            const source = await toFile(flatCanvas(240, 240), 'image/png', 'scene.png')
            const out = await runTool('/tools/ai/blur-people', [source], undefined, 600000)
            results.blurPeople = out[0]
              ? {
                  name: out[0].name,
                  dimensions: (await imageStats(out[0].blob)).dimensions,
                  logs: probe.lastLogs.filter((l) => /no people|person|ran on/.test(l)),
                }
              : { failed: true, logs: probe.lastLogs.slice(-4) }
          }

          /* 6. Whisper transcription of real speech */
          {
            const response = await fetch('/fixtures-speech.wav')
            const blob = await response.blob()
            const speech = new File([blob], 'speech.wav', { type: 'audio/wav' })
            const out = await runTool('/tools/audio/audio-transcribe', [speech], async () => {
              await setSelect('model', 'tiny')
              await setSelect('format', 'txt')
            }, 900000)
            const text = out[0] ? await out[0].blob.text() : ''
            results.transcribe = out[0]
              ? {
                  name: out[0].name,
                  type: out[0].type,
                  text: text.trim().slice(0, 200),
                  heardHello: /hello/i.test(text),
                  logs: probe.lastLogs.filter((l) => /ran on|transcript/.test(l)),
                }
              : { failed: true, logs: probe.lastLogs.slice(-4) }
          }
        } catch (error) {
          results.fatal = String(error && error.stack ? error.stack : error)
          try {
            results.logs = storeOf().logs.slice(-12).map((l) => `${l.level}: ${l.text}`)
          } catch {
            /* ignore */
          }
        }

        probe.step = 'done'
        document.title = JSON.stringify(results)
      }

      main().catch((error) => {
        document.title = JSON.stringify({ fatal: String(error) })
      })
    </script>
  </body>
</html>
