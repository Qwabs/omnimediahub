<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
    <style>
      html,
      body {
        margin: 0;
      }
      iframe {
        width: 1400px;
        height: 1000px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="f" src="/"></iframe>
    <script>
      /* Phase 8 probe: PWA shell, offline support, headers, SEO surface. */
      async function main() {
        const f = document.getElementById('f')
        const results = {}
        const wait = (ms) => new Promise((r) => setTimeout(r, ms))
        const probe = { step: 'boot', results, cutNetwork: false }
        window.__probe = probe
        const mark = (value) => {
          probe.step = value
        }

        async function until(fn, timeout = 120000, stepMs = 150) {
          const t0 = performance.now()
          for (;;) {
            try {
              const value = await fn()
              if (value) return value
            } catch {
              /* keep polling */
            }
            if (performance.now() - t0 > timeout) throw new Error('timeout: ' + probe.step)
            await wait(stepMs)
          }
        }

        const navigate = (url) =>
          new Promise((resolve) => {
            f.onload = () => resolve()
            f.src = url
          })
        const doc = () => f.contentDocument
        const win = () => f.contentWindow

        const dropAndProcess = async (file) => {
          const transfer = new win().DataTransfer()
          transfer.items.add(file)
          doc()
            .querySelector('[data-testid="dropzone"]')
            .dispatchEvent(new win().DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer }))
          const button = await until(() => {
            const candidate = doc().querySelector('[data-testid="process"]')
            return candidate && !candidate.disabled ? candidate : null
          }, 30000)
          button.click()
          await until(
            () => win().__omh.useSession.getState().files.some((item) => item.result || item.error) || null,
            120000,
          )
          await until(() => win().__omh.useSession.getState().running === false, 60000)
          const state = win().__omh.useSession.getState()
          return {
            results: state.files.filter((item) => item.result).length,
            errors: state.files.filter((item) => item.error).map((item) => item.error),
            logs: state.logs.slice(-3).map((line) => line.text),
          }
        }

        const makePng = async (name, colour = '#007aff') => {
          const canvas = document.createElement('canvas')
          canvas.width = 120
          canvas.height = 90
          const ctx = canvas.getContext('2d')
          ctx.fillStyle = colour
          ctx.fillRect(0, 0, 120, 90)
          const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'))
          return new File([blob], name, { type: 'image/png' })
        }

        try {
          /* 1. service worker active + shell precache */
          mark('wait for service worker')
          await until(async () => {
            if (!win().navigator.serviceWorker) return false
            const registrations = await win().navigator.serviceWorker.getRegistrations()
            return registrations.some((registration) => registration.active) ? registrations : false
          }, 120000)
          const cacheNames = await win().caches.keys()
          const precacheName = cacheNames.find((name) => name.includes('precache')) ?? ''
          const precacheEntries = precacheName
            ? await (await win().caches.open(precacheName)).keys()
            : []
          const urls = precacheEntries.map((request) => request.url)

          results.shell = {
            cacheNames,
            precacheEntries: urls.length,
            hasShellHtml: urls.some((url) => url.endsWith('/index.html') || url.endsWith('/')),
            hasAppJs: urls.some((url) => /\/assets\/index.*\.js$/.test(url)),
            hasFont: urls.some((url) => url.includes('/fonts/')),
            excludesEngines: !urls.some((url) => /\/wasm\/|\/ffmpeg\/|\/models\//.test(url)),
          }

          /* 2. manifest */
          const manifestUrl = doc().querySelector('link[rel="manifest"]')?.getAttribute('href') ?? ''
          const manifest = manifestUrl ? await (await fetch(manifestUrl)).json() : null
          results.manifest = {
            linked: Boolean(manifestUrl),
            display: manifest?.display ?? null,
            icons: manifest?.icons?.length ?? 0,
            name: (manifest?.name ?? '').slice(0, 40),
          }

          /* 3. cross-origin isolation headers (SharedArrayBuffer) */
          results.headers = await fetch('/favicon.svg').then((response) => ({
            coop: response.headers.get('cross-origin-opener-policy'),
            coep: response.headers.get('cross-origin-embedder-policy'),
          }))

          /* 4. prerendered SEO surface, fetched directly */
          const html = await (await fetch('/tools/convert/heic-to-jpg')).text()
          results.seo = {
            hasTitle: /<title>[^<]{10,}/.test(html),
            hasDescription: /<meta name="description"/.test(html),
            hasCanonical: /<link rel="canonical"/.test(html),
            hasJsonLd: /application\/ld\+json/.test(html),
            prerenderedBody: html.includes('HEIC to JPG'),
          }

          /* 5. warm the image engine while online */
          mark('warm up the engine')
          await navigate('/tools/convert/to-webp')
          const warm = await dropAndProcess(await makePng('warm.png'))
          const engineCache = (await win().caches.keys()).includes('omh-engines')
          const engineFiles = engineCache ? (await (await win().caches.open('omh-engines')).keys()).length : 0
          results.warmUp = { converted: warm.results, engineCacheCreated: engineCache, cachedEngineFiles: engineFiles }

          /* 6. ask the runner to cut the network, then keep working */
          mark('requesting offline cut')
          probe.cutNetwork = true
          await wait(4000)
          const offline = await fetch('/definitely-offline').then(
            () => false,
            () => true,
          )
          results.offlineDetected = offline

          mark('navigate offline')
          await navigate('/tools/convert/png-to-jpg')
          const dropzone = await until(() => doc().querySelector('[data-testid="dropzone"]'), 40000)
          results.offlineNavigation = {
            dropzoneRendered: Boolean(dropzone),
            title: doc().title.slice(0, 50),
            workspaceVisible: Boolean(doc().querySelector('[data-testid="workspace"]')),
          }

          mark('convert offline')
          const offlineRun = await dropAndProcess(await makePng('offline.png', '#30d158'))
          results.offlineRun = offlineRun
        } catch (error) {
          results.fatal = String(error && error.stack ? error.stack : error)
        }

        probe.step = 'done'
        document.title = JSON.stringify(results)
      }

      main().catch((error) => {
        document.title = JSON.stringify({ fatal: String(error) })
      })
    </script>
  </body>
</html>
